<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Proyecciones Únicas Madrid</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Proyecciones Únicas Madrid</h1>
        <!-- SUBTÍTULO NUEVO -->
        <p class="subtitle">
            Películas que ya no están en la cartelera comercial, pero que siguen vivas en la sala oscura. Encuentra reestrenos, pases especiales y clásicos proyectados en los cines de Madrid.
        </p>
    </header>

    <main>

        <div class="toolbar">

            <!-- 1. BUSCADOR CON LUPA -->
            <div class="search-box">
                <div class="input-with-icon">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input
                        type="search"
                        id="search-input"
                        placeholder="Buscar película, director, actor..."
                        autocomplete="off"
                    >
                </div>
            </div>

            <!-- 2. FILTRO POR FECHA (Caja + Botón agrupados) -->
            <div class="date-filter">
                <label for="date-input">Buscar por fecha</label>

                <div class="date-input-group">
                    <input
                        type="date"
                        id="date-input"
                    >

                    <button
                        type="button"
                        id="clear-date"
                    >
                        Limpiar
                    </button>
                </div>
            </div>

            <!-- 3. ORDENAR POR (Con su etiqueta arriba) -->
            <div class="controls">
                <label for="sort-select">Ordenar por</label>

                <select id="sort-select">
                    <option value="next-screening">Próxima proyección</option>
                    <option value="title-asc">Título: A-Z</option>
                    <option value="title-desc">Título: Z-A</option>
                    <option value="duration-asc">Duración: menor a mayor</option>
                    <option value="duration-desc">Duración: mayor a menor</option>
                    <option value="release-asc">Estreno: más antiguo primero</option>
                    <option value="release-desc">Estreno: más reciente primero</option>
                </select>
            </div>

        </div>

        <section class="movies-grid" id="movies-grid">
            <!-- Las películas aparecerán aquí -->
        </section>

        <p class="no-results" id="no-results">
            No se han encontrado películas.
        </p>

    </main>

    <script src="js/movies.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
